name: Test and release

# The suite runs on every push to main and again before any release asset is
# built, so a failing test keeps the zip off the release. Building and uploading
# only happen for a published release or a manual run: a plain commit must not
# replace the asset, whose SHA-256 is recorded in CHECKSUMS.txt.
#
# The source comes from the ref this workflow runs on, which is the default branch
# for a published release. It is not pinned to the release tag: the v1.0.0 tag was
# created before the Go source was committed and has no go.mod, so checking it out
# breaks the build. To build an older release on purpose, dispatch this workflow
# from that ref and pass the tag to upload to.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the zip to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # A failing step above stops the job here, so the zip cannot be attached
      # unless the suite passed.
      - name: Build Windows executable
        if: github.event_name != 'push'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o skyrim-audit.exe .

      - name: Package shareable zip
        if: github.event_name != 'push'
        run: zip -j skyrim-audit-share.zip skyrim-audit.exe READ-ME-FIRST.txt

      - name: Attach zip to the release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" skyrim-audit-share.zip --clobber --repo "${{ github.repository }}"
