name: Release build

# Rebuilds the Windows binary and refreshes the zip attached to the release.
# Runs when a v* tag is pushed, or by hand. Commits to main deliberately do NOT
# rebuild: the published zip's SHA-256 is recorded in CHECKSUMS.txt, and a new
# asset on every commit would make that note wrong within minutes.
# A tag build needs a release to exist for that tag (gh release upload fails
# otherwise), and the numbers in CHECKSUMS.txt should be updated with it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o skyrim-audit.exe .

      - name: Package shareable zip
        run: zip -j skyrim-audit-share.zip skyrim-audit.exe READ-ME-FIRST.txt

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
        run: gh release upload "$TAG" skyrim-audit-share.zip --clobber --repo "${{ github.repository }}"
