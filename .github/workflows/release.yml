name: Test and release

# The suite runs on both platforms, because the exe we ship is Windows and the
# audit's path handling and case folding behave differently there. A published
# release or a manual run then builds the Windows exe and attaches the zip to that
# release; a push to main only runs the suite. The release job needs every test
# run, so nothing is built or attached unless the suite passes everywhere.
#
# The source is the ref this workflow runs on - the default branch for a published
# release - not the release tag: the v1.0.0 tag predates the Go source and has no
# go.mod, so checking it out breaks the build.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One failing platform must not cancel the other: a Linux-only failure and a
      # Windows-only failure point at different code.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

  release:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o skyrim-audit.exe .

      - name: Package shareable zip
        run: zip -j skyrim-audit-share.zip skyrim-audit.exe READ-ME-FIRST.txt

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" skyrim-audit-share.zip --clobber --repo "${{ github.repository }}"
